[build]
  publish = "."

[[redirects]]
  from = "/strategic-assignment"
  to = "/strategic-assignment.html"
  status = 200

[[redirects]]
  from = "/credit-checklist"
  to = "/credit-checklist.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/influence-audit"
  to = "/influence-audit.html"
  status = 200

[[redirects]]
  from = "/ai-communication-audit"
  to = "/ai-communication-audit.html"
  status = 200

[[redirects]]
  from = "/ai-cheatsheet"
  to = "/ai-cheatsheet.html"
  status = 200

[[redirects]]
  from = "/champion-brief"
  to = "/champion-brief.html"
  status = 200

[[redirects]]
  from = "/hybrid-visibility-checklist"
  to = "/hybrid-visibility-checklist.html"
  status = 200

[[redirects]]
  from = "/ai-workshop-kit"
  to = "/ai-workshop-kit.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
